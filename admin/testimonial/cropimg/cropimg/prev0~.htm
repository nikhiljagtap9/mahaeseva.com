.slim-btn {
    background-color: rgba(0, 0, 0, 0.7);
    background-position: 50% center;
    background-repeat: no-repeat;
    background-size: 50% 50%;
    border: medium none;
    border-radius: 50%;
    color: #fff;
    font-size: 0;
    height: 36px;
    margin: 0 7.2px;
    outline: medium none;
    padding: 0;
    position: relative;
    width: 36px;
}
.slim-btn::before {
    border: 3px solid #2783f8;
    border-radius: inherit;
    bottom: -3px;
    box-sizing: border-box;
    content: "";
    left: -3px;
    opacity: 0;
    pointer-events: none;
    position: absolute;
    right: -3px;
    top: -3px;
    transform: scale(0.95);
    transition: all 0.25s ease 0s;
    z-index: -1;
}
.slim-btn:focus::before, .slim-btn:hover::before {
    opacity: 1;
    transform: scale(1);
}
.slim-btn * {
    pointer-events: none;
}
.slim-btn-group
{
    padding: 1.5em 0;text-align: center;bottom: 0;left: 0; overflow: hidden;position: absolute;right: 0;z-index: 2;
}
